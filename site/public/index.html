<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SALISCO</title>
    <!--
      Static hosting runs no middleware, so locale detection happens here.
      Every link is RELATIVE so this works unchanged whether the site is served
      from a domain root or from a /salisco-site/ project-pages subpath.
    -->
    <link rel="canonical" href="en/" />
    <link rel="alternate" hreflang="en" href="en/" />
    <link rel="alternate" hreflang="ar" href="ar/" />
    <link rel="alternate" hreflang="x-default" href="en/" />
    <meta http-equiv="refresh" content="0; url=en/" />
    <script>
      (function () {
        var target = "en/";
        try {
          var langs = navigator.languages || [navigator.language || "en"];
          for (var i = 0; i < langs.length; i++) {
            var base = String(langs[i]).toLowerCase().split("-")[0];
            if (base === "ar") { target = "ar/"; break; }
            if (base === "en") { break; }
          }
        } catch (e) {
          /* Fall through to English. */
        }
        location.replace(target);
      })();
    </script>
    <style>
      html, body { margin: 0; height: 100%; background: #05080f; color: #b8c4dc; }
      body {
        display: flex; align-items: center; justify-content: center;
        font: 15px/1.6 system-ui, sans-serif; text-align: center; padding: 24px;
      }
      a { color: #ff7a29; }
    </style>
  </head>
  <body>
    <noscript>
      <p>
        Continue to SALISCO in <a href="en/">English</a>
        or <a href="ar/" lang="ar">العربية</a>.
      </p>
    </noscript>
  </body>
</html>
